# Local GPU research preset. Do not use this as a Codex web smoke test.
tensor_order: 3
algorithm: bigamp_tensor
teacher: standard
scan_mode: alpha

matrix:
  N1: 200
  N2: 200
  M: 50

alpha_scan:
  start: 0.0
  stop: 4.0
  step: 0.1

training:
  samples_per_alpha: 20
  max_steps: 2000
  seed: 42

algorithm_params:
  damping: 0.2
  noise_var: 1.0e-5
  use_compile: true
  use_bf16: true
  init_mode: teacher
  init_overlap: 0.5

spreading:
  f_distribution: rademacher
  onsager_correction: false
  chunk_size: 262144

teacher_config:
  init_distribution: gaussian

output:
  storage_mode: lightweight
  save_tensors: false
  enable_heatmap: true
  plots:
    - curves: [A.y]
