[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Matrix-Factorization"
version = "0.1.0"
description = "Matrix Factorization Framework - Teacher-Student masked matrix factorization with GPU acceleration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sucia"}
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "rich>=13.0.0",
    "tqdm>=4.60.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
mf = "matrix_factorization.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "docs",
    "runs",
    "results",
    "artifacts",
    "src/matrix_factorization/Replica_results",
]

[tool.hatch.build.targets.wheel]
packages = ["src/matrix_factorization"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/matrix_factorization",
]
exclude = [
    "/src/matrix_factorization/results",
    "/src/matrix_factorization/__pycache__",
]
