tensor_order: 2
algorithm: 2
teacher: 2
teacher_config:
  init_distribution: 1
  mean_scale: 0.0
matrix:
  N1: 200
  N2: 200
  M: 50
scan:
  axes:
    onsager_policy:
      kind: composite
      values:
        onsager_adaptive_cap005:
          spreading.onsager_correction: true
          algorithm_params.adaptive_damping: true
          algorithm_params.damping: 0.01
          algorithm_params.step_min: 0.001
          algorithm_params.step_max: 0.05
          algorithm_params.step_incr: 1.1
          algorithm_params.step_decr: 0.5
          algorithm_params.step_window: 1
          algorithm_params.acceptance_tolerance: 0.0
    alpha:
      path: alpha
      values: [0.5, 1.0, 1.5, 2.0, 3.0, 4.0]
training:
  samples_per_alpha: 100
  max_steps: 500
seeds:
  model: 42
  data: 42
algorithm_params:
  damping: 0.5
  noise_var: 1.0e-05
  learning_rate: 0.01
  use_compile: true
  normalization_profile: paper_sparse_sampling
  precision_profile: aggressive
  precision_fallback_policy: allow
  use_bf16: true
  seed_partition_policy: partition_invariant
  use_early_stop: false
  target_loss_threshold: 1.0e-08
  default_alpha: 1.0
  adaptive_damping: false
  step_min: 0.05
  step_max: 0.5
  step_incr: 1.1
  step_decr: 0.5
  step_window: 1
  max_bad_steps: 10
  adaptive_restart: false
  restart_patience: 50
  restart_noise: 0.1
  acceptance_tolerance: 0.0
  init_mode: random
  init_overlap: 0.0
  debug_verbose: false
spreading:
  f_distribution: 1
  seed: 12345
  onsager_correction: false
  chunk_size: 8192
output:
  name: adaptive_cap005_probe
  storage_mode: full
  save_tensors: false
  enable_heatmap: false
  rsb_ordering: true
  heatmap_metric: Q_Y
  uniform_colormap: true
  plots:
  - x: alpha
    y: Q_Y_mean
    series_by:
    - onsager_policy
    filename: qy_by_onsager_policy.png
  - x: alpha
    y: Q_W_mean
    series_by:
    - onsager_policy
    filename: qw_by_onsager_policy.png
  - x: alpha
    y: Q_X_mean
    series_by:
    - onsager_policy
    filename: qx_by_onsager_policy.png
  - x: alpha
    y: Q_W_COS_ROOT_mean
    series_by:
    - onsager_policy
    filename: qw_cos_root_by_onsager_policy.png
  - x: alpha
    y: Q_X_COS_ROOT_mean
    series_by:
    - onsager_policy
    filename: qx_cos_root_by_onsager_policy.png
  - x: alpha
    y: Q_W_SIGN_GAUGE_mean
    series_by:
    - onsager_policy
    filename: qw_sign_gauge_by_onsager_policy.png
  - x: alpha
    y: Q_X_SIGN_GAUGE_mean
    series_by:
    - onsager_policy
    filename: qx_sign_gauge_by_onsager_policy.png
  group_results:
    enabled: auto
    save_tensors: false
    enable_heatmap: false
    write_plots: true
