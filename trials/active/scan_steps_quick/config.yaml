tensor_order: 2
algorithm: 1
teacher: 2
matrix:
  N1: 4
  N2: 4
  M: 1
scan:
  axes:
    alpha:
      path: alpha
      values: [0.1]
    max_steps:
      path: max_steps
      values: [1, 2]
training:
  samples_per_alpha: 1
  max_steps: 2
  max_epochs: 2
algorithm_params:
  damping: 0.5
  noise_var: 1.0e-5
  use_compile: false
  use_bf16: false
output:
  save_tensors: false
  enable_heatmap: false
