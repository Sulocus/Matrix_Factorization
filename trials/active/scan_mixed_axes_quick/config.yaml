tensor_order: 2
algorithm: 2
teacher: 2
matrix:
  N1: 4
  N2: 4
  M: 1
scan:
  axes:
    damping:
      path: algorithm_params.damping
      values: [0.4, 0.6]
    onsager:
      path: spreading.onsager_correction
      values: [false, true]
    init:
      kind: composite
      values:
        cold:
          algorithm_params.init_mode: random
        warm_095:
          algorithm_params.init_mode: teacher
          algorithm_params.init_overlap: 0.95
    alpha:
      path: alpha
      values: [0.0, 0.1]
training:
  samples_per_alpha: 1
  max_steps: 1
algorithm_params:
  damping: 0.5
  noise_var: 1.0e-5
  use_compile: false
  use_bf16: false
spreading:
  f_distribution: 1
  seed: 123
  chunk_size: 0
output:
  save_tensors: false
  enable_heatmap: false
  plots:
    - x: alpha
      y: Q_Y_mean
      where:
        init: warm_095
      series_by: [damping, onsager]
      filename: qy_mixed_axes.png
