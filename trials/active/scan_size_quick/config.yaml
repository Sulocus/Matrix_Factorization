tensor_order: 2
algorithm: 1
teacher: 2
matrix:
  N1: 4
  N2: 4
  M: 1
scan:
  axes:
    size:
      kind: composite
      values:
        N4_M1:
          matrix.N1: 4
          matrix.N2: 4
          matrix.M: 1
        N5_M1:
          matrix.N1: 5
          matrix.N2: 5
          matrix.M: 1
    alpha:
      path: alpha
      values: [0.0]
training:
  samples_per_alpha: 1
  max_steps: 2
  max_epochs: 2
algorithm_params:
  damping: 0.5
  noise_var: 1.0e-5
  use_compile: false
  use_bf16: false
output:
  save_tensors: false
  enable_heatmap: false
