# ===== Cold Start (Random Initialization) =====
# 随机初始化进行 Hysteresis Analysis 对照组

algorithm: 2  # bigamp_spreading
teacher: 2    # standard

allow_intra_connection: false  # bipartite mode

matrix:
  N1: 500
  N2: 500
  M: 50

scan:
  axes:
    alpha:
      path: alpha
      values:
        start: 0
        stop: 4
        step: 0.2

training:
  samples_per_alpha: 5
  max_steps: 10000

algorithm_params:
  damping: 0.3
  noise_var: 1.0e-5
  use_compile: true
  use_bf16: true
  
  # ===== COLD START CONFIGURATION =====
  init_mode: random      # "random" = Cold Start (default)
  init_overlap: 0.95     # (ignored when init_mode=random)

spreading:
  f_distribution: 1      # ising
  onsager_correction: false

teacher_config:
  init_distribution: 2   # rademacher

output:
  storage_mode: lightweight
  plots:
    - curves: [D.y]
