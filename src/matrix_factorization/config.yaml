# =============================================================================
#                    Matrix Factorization 实验配置
# =============================================================================
# 配置说明：
#   - 数字和字符串格式均可使用（如 algorithm: 2 或 algorithm: bigamp_spreading）
#   - 带 ⚠️ 标记的参数请谨慎修改
# =============================================================================

# =============================================================================
# 主配置：张量阶数（决定算法和图模式）
# =============================================================================
# 可选值：
#   1 = 一般图（General Graph）：自动启用 allow_intra_connection
#   2 = 二分图/矩阵分解（Bipartite）：标准模式（默认）
#   3+ = N维张量分解：使用 bigamp_tensor 算法
tensor_order: 3

# =============================================================================
# 算法选择（仅在 tensor_order=1,2 时生效）
# =============================================================================
# 可选值（数字或字符串均可）：
#   1 | bigamp           = 标准 BiG-AMP
#   2 | bigamp_spreading = 带随机spreading的BiG-AMP（推荐）
#   3 | agd              = 交替梯度下降（慢但稳定）
#   4 | bigamp_tensor    = 张量 AMP (n>=3)
#   5 | agd_tensor       = 张量 AGD (n>=3)
# ⚠️ 注意：tensor_order >= 3 时推荐使用 bigamp_tensor
algorithm: 4  # 推荐: bigamp_tensor 或 agd_tensor

# =============================================================================
# Teacher 类型
# =============================================================================
# 可选值：
#   1 | orthogonal = 正交 Teacher（理论分析用）
#   2 | standard   = 标准高斯 Teacher（推荐）
teacher: 2

# =============================================================================
# Teacher 初始化分布
# =============================================================================
# init_distribution:
#   1 | gaussian   = 高斯分布 N(0, 1/√M)（默认）
#   2 | rademacher = ±1/√M（类 Ising 模型，一般图模式推荐）
teacher_config:
  init_distribution: 1

# =============================================================================
# 矩阵尺寸
# =============================================================================
matrix:
  N1: 200     # 行数
  N2: 200     # 列数
  M: 50       # 秩（隐藏维度）

# =============================================================================
# Scan 参数空间
# =============================================================================
# scan.axes 是唯一主入口。alpha、max_steps、size、init、damping、onsager 等都只是 axis。
# kind: composite 用于一个 axis 同时覆盖多个参数，例如 size 或 cold/warm init。
scan:
  axes:
    alpha:
      path: alpha
      values:
        start: 0.0
        stop: 4.0
        step: 0.1

# =============================================================================
# 训练参数
# =============================================================================
training:
  samples_per_alpha: 20   # 每个 alpha 值的样本数
  max_steps: 2000        # BiG-AMP 最大迭代步数

# =============================================================================
# 随机种子（用于复现）
# =============================================================================
seeds:
  model: 42
  data: 42

# =============================================================================
# 算法参数
# =============================================================================
algorithm_params:
  damping: 0.2           # 阻尼系数（重要修正：0.01 以匹配增量更新）
  noise_var: 1.0e-5       # 观测噪声方差
  learning_rate: 0.01     # AGD 学习率
  use_compile: true       # 启用 torch.compile 加速
  use_bf16: true          # 启用 BF16 混合精度
  use_early_stop: false   # 早停
  target_loss_threshold: 1.0e-08
  default_alpha: 1.0
  
  # --- Adaptive Damping ---
  adaptive_damping: false
  step_min: 0.05
  step_max: 1
  step_incr: 1.1
  step_decr: 0.9
  step_window: 1
  max_bad_steps: 10
  
  # --- Adaptive Warm Restart ---
  adaptive_restart: false
  restart_patience: 50
  restart_noise: 0.1
  
  # --- Adaptive Tolerance (Metropolis-like) ---
  acceptance_tolerance: 50
  
  # --- Teacher-Assisted Initialization ---
  # init_mode: random = Cold Start, teacher = Warm Start
  # init_mode: random = Cold Start, teacher = Warm Start
  init_mode: teacher           # 使用 Warm Start (验证通过)
  init_overlap: 0.5            # 强初始相关性 (验证通过)
  
  # --- Debugging ---
  debug_verbose: false         # 是否开启详细调试模式（每100步计算MSE，会影响性能）

# =============================================================================
# Spreading 配置（algorithm = 2 | bigamp_spreading 时生效）
# =============================================================================
# f_distribution:
#   1 | rademacher = Rademacher 分布（推荐，更稳定）
#   2 | gaussian   = 高斯分布
spreading:
  f_distribution: 1       # rademacher（推荐）
  seed: 12345
  # ⚠️ Onsager 修正开关
  # - false = 关闭（二分图模式推荐）
  # - true  = 开启（可能提高收敛性，但一般图模式下可能不稳定）
  onsager_correction: false
  chunk_size: 262144      # General模式分块大小（0=禁用分块）

# =============================================================================
# 输出设置
# =============================================================================
output:
  name: ""                # 留空自动生成
  
  # 存储模式：full | lightweight | plotting_only
  storage_mode: lightweight
  
  # Heatmap 设置
  enable_heatmap: true     # 是否生成 Heatmap (Replica Overlap)
  rsb_ordering: true        # 是否对 Heatmap 进行聚类排序 (检测 RSB)
  heatmap_metric: "Q_Y"     # 绘制指标: "Q_Y" (Tensor Overlap) 或 "Q_W" (Factor Gram Overlap)
  uniform_colormap: true  # true=均匀颜色, false=增强高值区域
  
  # =============================================================================
  # 绘图指标格式
  # =============================================================================
  # 格式: 类别.指标[:R]，其中 :R = replica (学生-学生 overlap)
  #
  # 指标类别：
  #   A (Cosine):     A.y=Q_Y  A.w=Q_W  A.x=Q_X
  #   B (Normalized): B.w=Q_W' B.x=Q_X'
  #   C (Split):      C.o=Q_Y_observed  C.u=Q_Y_unobserved
  #   D (Physical):   D.y D.w D.x
  #   E (Other):      E.e=Gen_Error (不支持:R)
  #
  # 示例: curves: [A.y, A.w, A.y:R] → Q_Y, Q_W, Q_Y(replica) 画同一张图
  
  plots:
    - curves: [A.y]  # Q_Y + 归一化 overlap
  #  - curves: [D.y]       # Physical overlap Y
