# ===== 张量阶数（决定问题维度）=====
# 1 = 一般图模式 (general graph)：允许 W-W, W-X, X-X 连接（支持三角环）
# 2 = 二分图/矩阵分解 (bipartite/matrix)：只有 W-X 连接（默认，高效）
# 3+ = N 维张量分解：从 N 个因子中各取一个节点（高阶 CP 分解）
tensor_order: 2

# ===== 算法 (选一个数字) =====
# 1 = bigamp (标准 BiG-AMP)
# 2 = bigamp_spreading (二分图 spreading)
# 3 = agd (交替梯度下降)
# 4 = bigamp_tensor (N 维张量 spreading) ← 新增
algorithm: 2

# ===== Teacher (选一个数字) =====
# 1 = orthogonal
# 2 = standard
teacher: 2

# ===== Teacher 配置 (可选) =====
# init_distribution: 1 = gaussian (默认, N(0,1/√M))
#                    2 = rademacher (±1/√M, 类 Ising 模型)
teacher_config:
  init_distribution: 2  # OPTIMAL: Rademacher (stable for General Mode)

# ===== 矩阵尺寸 =====
matrix:
  N1: 1500
  N2: 1500
  M: 500

# ===== 扫描模式 (选一个数字) =====
# 1 = alpha 扫描 (固定 steps，扫描 alpha)
# 2 = steps 扫描 (固定 alpha，扫描 steps)
# 3 = nested 嵌套扫描 (外层 N/M，内层 alpha)
# 4 = hysteresis (Cold vs Warm Start)
scan_mode: 1

# --- Alpha 扫描配置 (scan_mode = 1) ---
alpha_scan:
  start: 0
  stop: 3
  step: 0.1             # RESTORED             

# --- Steps 扫描配置 (scan_mode = 2) ---
steps_scan:
  alpha: 3.9             # 固定的 alpha 值
  step_values: [100, 200, 500, 1000, 2000, 3000, 5000,10000,20000,30000, 50000]
  multiplier: 1           # 倍数: BiGAMP=1, AGD=10-20


# 扫描配置
scan:
  axis: 0
  # Alpha values from 1.0 to 2.0
  values: [1.0, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2.0]

# --- 嵌套扫描配置 (scan_mode = 3) ---
nested_scan:
  sizes: [[200, 50], [400, 100]]
  alpha:
    start: 0
    stop: 3
    step: 0.1

# 4 = hysteresis (Cold vs Warm Start)
hysteresis_scan:
  init_overlaps: [0.0, 0.98]  # 比对列表: 0=Cold, >0=Warm
  alpha:
    start: 0
    stop: 4
    step: 0.1

training:
  samples_per_alpha: 1   # RESTORED
  max_steps: 30000         # RESTORED
  # max_epochs: 40000
  # num_workers: 24

# 随机种子
seeds:
  model: 42
  data: 42

# ===== 算法参数 =====
algorithm_params:
  damping: 0.2  # OPTIMAL: Based on 9-point sweep (score=0.0126)
  noise_var: 1.0e-5
  learning_rate: 0.01
  use_compile: true
  use_bf16: true
  use_early_stop: false
  target_loss_threshold: 1.0e-08
  default_alpha: 1.0
  
  # Adaptive Damping
  adaptive_damping: false
  step_min: 0.05
  step_max: 1
  step_incr: 1.1
  step_decr: 0.9
  step_window: 1
  max_bad_steps: 10
  
  # Adaptive Warm Restart
  adaptive_restart: true
  restart_patience: 50
  restart_noise: 0.1
  
  # Adaptive Tolerance (Metropolis-like)
  # Allow likelihood to drop by this amount (try 1.0 - 100.0)
  acceptance_tolerance: 50
  
  # Teacher-Assisted Initialization (Hysteresis Analysis)
  # init_mode: "random" = Cold Start, "teacher" = Warm Start
  # init_overlap: Initial overlap with teacher (0.9 - 0.99)
  init_mode: random
  init_overlap: 0

# ===== Spreading 专用 (algorithm = 2) =====
# f_distribution: 1 = rademacher, 2 = gaussian
spreading:
  f_distribution: 1
  seed: 12345
  onsager_correction: false  # CRITICAL: Must be OFF for General Mode
  chunk_size: 262144  # General模式分块大小 (0=禁用，使用旧版串行方式)
  # 注意: allow_intra_connection 已移至文件顶层

# ===== 输出设置 =====
output:
  name: ""               # 留空自动生成
  
  # 存储模式: full(完整) / lightweight(轻量) / plotting_only(仅绘图)
  storage_mode: lightweight
  
  # Heatmap 开关 (独立于 plots)
  enable_heatmap: false
  rsb_ordering: true     # 热力图 RSB 排序 (层次聚类)
  uniform_colormap: true # true=均匀颜色, false=增强高值区域(0.9-1.0)
  
  # ===== 绘图指标格式 =====
  # 格式: 类别.指标[:R]，其中 :R = replica (学生-学生)
  #
  # A (Cosine):     A.y=Q_Y  A.w=Q_W  A.x=Q_X
  # B (Normalized): B.w=Q_W' B.x=Q_X'
  # C (Split):      C.o=Q_Y_observed  C.u=Q_Y_unobserved
  # D (Physical):   D.y D.w D.x
  # E (Other):      E.e=Gen_Error (不支持:R)
  #
  # 示例: curves: [A.y, A.w, A.y:R] = Q_Y, Q_W, Q_Y(replica) 画同一张图
  
  plots:
    - curves: [A.y]      # Q_Y + 归一化 overlap
    - curves: [D.y]
    # - curves: [C.o, C.u, C.u:R]           # observed vs unobserved
    # - curves: [A.y, A.y:R]
    # - curves: [B.w, B.w:R]

